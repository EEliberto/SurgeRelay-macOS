name: Upload release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-asset-staging
      - name: Reassemble and verify DMG
        run: |
          cat release-parts/part-* > Surge-Relay-260922-build-27092202.dmg
          echo "05e0d36fe826bc5046374662ccb275b3cfcbb42d2f4967ba14882cb31f26c546  Surge-Relay-260922-build-27092202.dmg" | sha256sum --check
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v260922 Surge-Relay-260922-build-27092202.dmg --clobber
